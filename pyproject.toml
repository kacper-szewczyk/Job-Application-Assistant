[project]
name = "jaa"
version = "0.17.0"
description = "Local-first Job Application Assistant"
readme = "README.md"
authors = [
    { name = "Kacper Szewczyk", email = "kacper.szewczyk@wp.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "platformdirs>=4.13.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "starlette>=1.8.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
jaa = "jaa.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "DTZ", "S", "T20", "ANN", "TID",
]
ignore = [
    "ANN401", # Any is allowed with a justifying comment (see CLAUDE.md)
]

[tool.ruff.lint.per-file-ignores]
# CVs use en/em dashes and typographic quotes; the importers and their tests match them.
"tests/**" = ["S101", "ANN", "RUF001"]
"src/jaa/importers/**" = ["RUF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "latex: compiles real PDFs; skipped without a LaTeX engine unless JAA_REQUIRE_LATEX=1",
]
