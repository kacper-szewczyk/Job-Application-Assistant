name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by release-please.yml to check the release PR, which GitHub does not run CI on
  # because release-please opens it with GITHUB_TOKEN.
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to check (defaults to the triggering ref).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
